name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-skip-citations:
    name: Lint skip-list ADR citations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout atlas-security (for the lint script)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spacecode-art/atlas-security
          ref: v1.0.0
          path: atlas-security

      - name: Run lint-skip-citations.py against ci.yml
        # See atlas-security ADR-0008. Fails the build if any
        # checkov-skip-checks ID isn't cited alongside an ADR-\d+
        # token in a comment — enforces the convention this repo has
        # followed by hand since ADR-0010, now as a real gate instead
        # of relying on PR review noticing.
        run: |
          python3 atlas-security/scripts/lint-skip-citations.py \
            .github/workflows/ci.yml

  secrets-scan:
    name: Secrets Scan
    permissions:
      contents: read
      pull-requests: write   # required by the nested gitleaks job — see atlas-security reusable-secrets-scan.yml
    uses: spacecode-art/atlas-security/.github/workflows/reusable-secrets-scan.yml@v1.0.0
    with:
      fail-on-findings: true
    secrets:
      ingest-token: ${{ secrets.ATLAS_SECURITY_INGEST_TOKEN }}

  repository-check:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Required Files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f .gitignore
          test -f .editorconfig
          test -f Makefile
          echo "Repository standards verified."

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack
        ports:
          - 4566:4566
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.11.0"

      - name: Bootstrap - Init and Apply
        working-directory: terraform/bootstrap/backend
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Plan - Development
        working-directory: terraform/environments/development
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json

      - name: Upload plan JSON for policy scan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terraform-plan-development
          path: terraform/environments/development/plan.json
          retention-days: 1

  terratest:
    name: Terratest (storage, networking, iam, organizations)
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack
        ports:
          - 4566:4566
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.0"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tests/terratest/go.mod
          cache-dependency-path: tests/terratest/go.sum

      - name: Run Terratest
        # No build tags — this deliberately excludes the database
        # suite, which requires the ministack_unsafe_rds tag and is
        # opt-in only (make test-database-unsafe), never CI (ADR-0019).
        working-directory: tests/terratest
        run: go test -v -timeout 15m

  security-scan:
    name: Security Scan
    uses: spacecode-art/atlas-security/.github/workflows/reusable-iac-scan.yml@v1.0.0
    with:
      directory: terraform/
      # CKV_AWS_144/145/119/18/CKV2_61/62/11 — ADR-0010 (S3/DynamoDB/VPC deferrals)
      # CKV_AWS_130 — ADR-0010 (deliberate public-subnet public-IP design)
      # CKV2_AWS_30 — ADR-0013 (Postgres query logging, deferred)
      # CKV_AWS_157 — ADR-0013 (Multi-AZ, cost tradeoff, dev-only)
      # CKV_AWS_353 — ADR-0013 (Performance Insights, cost tradeoff, dev-only)
      # CKV_AWS_118 — ADR-0013 (Enhanced Monitoring, cost tradeoff, dev-only)
      # CKV_AWS_293 — ADR-0013 (deletion protection, configurable, off by default in dev)
      checkov-skip-checks: >-
        CKV_AWS_144,CKV_AWS_145,CKV_AWS_119,CKV_AWS_18,
        CKV2_AWS_61,CKV2_AWS_62,CKV2_AWS_11,
        CKV_AWS_130,CKV2_AWS_30,CKV_AWS_157,
        CKV_AWS_353,CKV_AWS_118,CKV_AWS_293
    secrets:
      ingest-token: ${{ secrets.ATLAS_SECURITY_INGEST_TOKEN }}

  policy-scan:
    name: Policy Scan
    needs: terraform-plan
    uses: spacecode-art/atlas-security/.github/workflows/reusable-opa-scan.yml@v1.0.0
    with:
      plan-artifact-name: terraform-plan-development
  
  sast-scan:
    name: SAST Scan
    uses: spacecode-art/atlas-security/.github/workflows/reusable-sast-scan.yml@v1.0.0
    with:
      directory: terraform/
      config: p/terraform
      # fail-on-findings intentionally false — soft rollout, see
      # atlas-security ADR-0003. Revisit once a baseline is established.
      fail-on-findings: false
    secrets:
      ingest-token: ${{ secrets.ATLAS_SECURITY_INGEST_TOKEN }}

  trivy-scan:
    name: Trivy Scan (third opinion)
    uses: spacecode-art/atlas-security/.github/workflows/reusable-trivy-scan.yml@v1.0.0
    with:
      directory: terraform/ 
