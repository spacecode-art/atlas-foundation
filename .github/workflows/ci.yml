name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  secrets-scan:
    name: Secrets Scan
    uses: spacecode-art/atlas-security/.github/workflows/reusable-secrets-scan.yml@main
    with:
      fail-on-findings: true

  repository-check:
    name: Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f .gitignore
          test -f .editorconfig
          test -f Makefile
          echo "Repository standards verified."

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack
        ports:
          - 4566:4566
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Bootstrap - Init and Apply
        working-directory: terraform/bootstrap/backend
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Plan - Development
        working-directory: terraform/environments/development
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          quiet: true
          soft_fail: false
          # CKV_AWS_144/145/119/18/CKV2_61/62/11 — ADR-0010 (S3/DynamoDB/VPC deferrals)
          # CKV_AWS_130 — ADR-0010 (deliberate public-subnet public-IP design)
          # CKV2_AWS_30 — ADR-0013 (Postgres query logging, deferred)
          # CKV_AWS_157 — ADR-0013 (Multi-AZ, cost tradeoff, dev-only)
          # CKV_AWS_353 — ADR-0013 (Performance Insights, cost tradeoff, dev-only)
          # CKV_AWS_118 — ADR-0013 (Enhanced Monitoring, cost tradeoff, dev-only)
          # CKV_AWS_293 — ADR-0013 (deletion protection, configurable, off by default in dev)
          skip_check: >-
            CKV_AWS_144,CKV_AWS_145,CKV_AWS_119,CKV_AWS_18,
            CKV2_AWS_61,CKV2_AWS_62,CKV2_AWS_11,
            CKV_AWS_130,CKV2_AWS_30,CKV_AWS_157,
            CKV_AWS_353,CKV_AWS_118,CKV_AWS_293